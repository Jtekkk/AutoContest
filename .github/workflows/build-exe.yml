name: Build executables

# Builds standalone AutoContest executables with PyInstaller.
# PyInstaller cannot cross-compile, so each OS is built on its own runner.
# Download the artifacts from the run's "Summary" page, or — when you push a
# version tag like `v1.0.0` — grab them from the auto-created GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: # allows building manually from the Actions tab

permissions:
  contents: write # needed to attach binaries to a Release on tag builds

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AutoContest-windows
            binary: dist/AutoContest.exe
          - os: macos-latest
            artifact: AutoContest-macos
            binary: dist/AutoContest
          - os: ubuntu-latest
            artifact: AutoContest-linux
            binary: dist/AutoContest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller 2captcha-python

      - name: Build executable
        run: pyinstaller AutoContest.spec

      - name: Smoke-test the executable
        run: ${{ matrix.binary }} --help

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

      - name: Attach to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary }}
